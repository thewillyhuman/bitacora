# A three-member etcd for a bitacora cluster that is being tried out: one
# member per zone, each on a 10 GiB volume of the cluster's default
# StorageClass. No TLS, no authentication and no backups: for a test only.
#
#   kubectl --context <context> --namespace bitacora apply --filename etcd.yaml
#
# The chart of bitacora finds it at http://etcd:2379, its default, or at the
# three members, as values.yaml in this directory names them. A cluster that
# pulls images through a mirror needs the image below changed, and one
# without zones needs the topologySpreadConstraints removed.
apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  labels: {app.kubernetes.io/name: etcd}
spec:
  clusterIP: None
  # Members must find each other before any of them is ready.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: etcd}
  ports:
    - {name: client, port: 2379}
    - {name: peer, port: 2380}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels: {app.kubernetes.io/name: etcd}
spec:
  selector: {app.kubernetes.io/name: etcd}
  ports:
    - {name: client, port: 2379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  labels: {app.kubernetes.io/name: etcd}
spec:
  serviceName: etcd-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: etcd}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    metadata:
      labels: {app.kubernetes.io/name: etcd}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: etcd}
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.6.8-0
          command: [etcd]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).etcd-headless:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).etcd-headless:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd-headless:2380,etcd-1=http://etcd-1.etcd-headless:2380,etcd-2=http://etcd-2.etcd-headless:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=bitacora-test
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: client, containerPort: 2379}
            - {name: peer, containerPort: 2380}
          readinessProbe:
            httpGet: {path: /readyz, port: client}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: client}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
