# I/O discipline (design, section 17): only thin adapter modules may touch the
# clock, the network, the disk or a random source. Everything else receives
# them through an injected interface, which is what makes deterministic
# simulation possible. An adapter opts out with
# `#[allow(clippy::disallowed_methods, clippy::disallowed_types)]` and a
# comment saying which interface it implements.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "use the injected Clock; tokio::time is virtual under simulation" },
    { path = "std::time::SystemTime::now", reason = "use the injected Clock" },
    { path = "std::thread::sleep", reason = "use tokio::time::sleep, which is virtual under simulation" },
    { path = "std::thread::spawn", reason = "threads are not deterministic; spawn a task instead" },
    { path = "std::fs::read", reason = "use the injected Disk" },
    { path = "std::fs::write", reason = "use the injected Disk" },
    { path = "std::fs::remove_file", reason = "use the injected Disk" },
    { path = "std::fs::rename", reason = "use the injected Disk" },
    { path = "std::fs::create_dir_all", reason = "use the injected Disk" },
    { path = "std::fs::read_dir", reason = "use the injected Disk" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "use the injected Disk" },
    { path = "std::fs::OpenOptions", reason = "use the injected Disk" },
    { path = "std::net::TcpStream", reason = "use the injected ReplicaConnector" },
    { path = "std::net::TcpListener", reason = "only the server adapter may listen" },
    { path = "std::collections::HashMap", reason = "iteration order is random per process; use BTreeMap so simulation stays deterministic" },
    { path = "std::collections::HashSet", reason = "iteration order is random per process; use BTreeSet so simulation stays deterministic" },
]
