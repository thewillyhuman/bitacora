[workspace]
resolver = "3"
members = [
    "bitacora-client",
    "bitacora-controller",
    "bitacora-meta",
    "bitacora-model",
    "bitacora-replica",
    "bitacora-segment",
    "bitacora-sim",
    "bitacora-testkit",
    "bitacora-types",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/thewillyhuman/bitacora"
authors = ["Guillermo Facundo Colunga"]

[workspace.dependencies]
# First-party crates.
bitacora-client = { path = "bitacora-client", version = "0.0.0" }
bitacora-controller = { path = "bitacora-controller", version = "0.0.0" }
bitacora-meta = { path = "bitacora-meta", version = "0.0.0" }
bitacora-model = { path = "bitacora-model", version = "0.0.0" }
bitacora-replica = { path = "bitacora-replica", version = "0.0.0" }
bitacora-segment = { path = "bitacora-segment", version = "0.0.0" }
bitacora-sim = { path = "bitacora-sim", version = "0.0.0" }
bitacora-testkit = { path = "bitacora-testkit", version = "0.0.0" }
bitacora-types = { path = "bitacora-types", version = "0.0.0" }

# Third-party crates. One version for the whole workspace.
async-trait = "0.1"
bytes = "1"
crc32c = "0.6"
fs4 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

# The protocol model's tests explore a few million states. That is pure
# computation, so this one crate is optimized even in development builds;
# the checks then take seconds instead of minutes. Bazel does the same in
# bitacora-model/BUILD.bazel.
[profile.dev.package.bitacora-model]
opt-level = 3
overflow-checks = true

[workspace.lints.rust]
# Unsafe code is forbidden by default. A module that needs it carries an
# `#[allow(unsafe_code)]` with a written justification (design, section 17).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Crate names already scope every item, so `segment::SegmentWriter` is fine.
module_name_repetitions = "allow"
# Descriptive names win over this lint: a `Replica` has a `replica_id`.
struct_field_names = "allow"
# `expect` states an invariant that cannot fail, so it is not part of a
# function's contract. Conditions a caller can trigger are documented by hand
# under `# Panics`.
missing_panics_doc = "allow"
