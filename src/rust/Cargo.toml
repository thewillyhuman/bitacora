[workspace]
resolver = "3"
members = [
    "bitacora",
    "bitacora-artifact",
    "bitacora-artifact-s3",
    "bitacora-client",
    "bitacora-controller",
    "bitacora-kv",
    "bitacora-materializer",
    "bitacora-meta",
    "bitacora-meta-etcd",
    "bitacora-model",
    "bitacora-process",
    "bitacora-proto",
    "bitacora-replica",
    "bitacora-segment",
    "bitacora-sim",
    "bitacora-testkit",
    "bitacora-types",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/thewillyhuman/bitacora"
authors = ["Guillermo Facundo Colunga"]

[workspace.dependencies]
# First-party crates.
bitacora = { path = "bitacora", version = "0.0.0" }
bitacora-artifact = { path = "bitacora-artifact", version = "0.0.0" }
bitacora-artifact-s3 = { path = "bitacora-artifact-s3", version = "0.0.0" }
bitacora-client = { path = "bitacora-client", version = "0.0.0" }
bitacora-controller = { path = "bitacora-controller", version = "0.0.0" }
bitacora-kv = { path = "bitacora-kv", version = "0.0.0" }
bitacora-materializer = { path = "bitacora-materializer", version = "0.0.0" }
bitacora-meta = { path = "bitacora-meta", version = "0.0.0" }
bitacora-meta-etcd = { path = "bitacora-meta-etcd", version = "0.0.0" }
bitacora-model = { path = "bitacora-model", version = "0.0.0" }
bitacora-process = { path = "bitacora-process", version = "0.0.0" }
bitacora-proto = { path = "bitacora-proto", version = "0.0.0" }
bitacora-replica = { path = "bitacora-replica", version = "0.0.0" }
bitacora-segment = { path = "bitacora-segment", version = "0.0.0" }
bitacora-sim = { path = "bitacora-sim", version = "0.0.0" }
bitacora-testkit = { path = "bitacora-testkit", version = "0.0.0" }
bitacora-types = { path = "bitacora-types", version = "0.0.0" }

# Third-party crates. One version for the whole workspace.
async-trait = "0.1"
# The HTTP server that tonic already brings, here for the metrics and health
# endpoint of the daemons. Only what serving plain HTTP/1 needs.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
crc32c = "0.6"
etcd-client = "0.21"
fs4 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The S3 client. Its `aws` feature would bring aws-lc-rs, a large C library,
# for signing and for TLS; `aws-base` with `ring` is the same client on the
# smaller ring.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
prometheus-client = "0.26"
prost = "0.14"
protox = "0.10"
# Named only to choose how object_store's HTTP client does TLS: rustls with
# the platform's trusted roots and no built-in cryptography, which
# bitacora-artifact-s3 supplies from ring.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1"
# gRPC without TLS and without compression: neither is used yet, and both
# are slow to build.
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
tracing = "0.1"
# Log output of the daemons: JSON for machines, plain text for people.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

# The protocol model's tests explore a few million states. That is pure
# computation, so this one crate is optimized even in development builds;
# the checks then take seconds instead of minutes. Bazel does the same in
# bitacora-model/BUILD.bazel.
[profile.dev.package.bitacora-model]
opt-level = 3
overflow-checks = true

[workspace.lints.rust]
# Unsafe code is forbidden by default. A module that needs it carries an
# `#[allow(unsafe_code)]` with a written justification (design, section 17).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Crate names already scope every item, so `segment::SegmentWriter` is fine.
module_name_repetitions = "allow"
# Descriptive names win over this lint: a `Replica` has a `replica_id`.
struct_field_names = "allow"
# `expect` states an invariant that cannot fail, so it is not part of a
# function's contract. Conditions a caller can trigger are documented by hand
# under `# Panics`.
missing_panics_doc = "allow"
