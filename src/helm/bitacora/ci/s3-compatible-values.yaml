# A cluster that tiers to an S3-compatible service, such as Ceph, with an
# access key that the operator keeps in a Secret named `bitacora-s3`.
# //src/helm:chart_test renders the chart with this file.
etcd:
  endpoints:
    - http://etcd-0.etcd:2379
    - http://etcd-1.etcd:2379
    - http://etcd-2.etcd:2379
  keyPrefix: /bitacora/production/

objectStore:
  kind: s3
  s3:
    bucket: bitacora-segments
    endpoint: https://s3.example.org
    keyPrefix: production/
    credentials:
      existingSecret: bitacora-s3
      accessKeyIdKey: access-key
      secretAccessKeyKey: secret-key
