{{/*
The ServiceAccount the pods run as. The daemons do not use the Kubernetes API;
the account exists to carry the annotation by which a cloud provider gives the
pods access to the object store.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bitacora.serviceAccountName" . }}
  labels:
    {{- include "bitacora.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
