# Builds, lints and tests every change. One Bazel invocation does all three,
# so what passes here is exactly what `hack/check.sh` checks locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Most of the runner's disk is taken by toolchains this build never
      # uses. What is left was once not enough for the Bazel caches, the
      # toolchains Bazel downloads and the outputs of a build: a link step
      # failed with nothing but an exit status, and only the upload of the
      # cache afterwards said that the disk was full. Each line this step
      # prints says what removing one of those toolchains cost and what it
      # left free, so the list can be kept to what pays for its time.
      - name: Free disk space
        run: |
          df -h /
          for directory in /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android; do
            started_at="$(date +%s)"
            sudo rm -rf "${directory}"
            echo "removed ${directory} in $(($(date +%s) - started_at))s, $(df --output=avail -h / | tail -n 1 | tr -d ' ') free"
          done
      # Restores Bazel itself, the downloaded dependencies and the action
      # cache, so an unchanged crate is neither rebuilt nor retested.
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci
          repository-cache: true
      # setup-bazel points Bazel at ~/.cache/bazel-disk and saves that
      # directory as the job leaves it: what it restored plus what this run
      # added. Entries that no build asks for any more would pile up, and
      # every later run would download and unpack them. Bazel refreshes the
      # modification time of each entry it uses, also of one it does not
      # download, so an entry that is not newer than this marker was not used
      # by the build that follows. Those are removed once the build passed.
      - name: Mark the start of the build
        run: touch "${RUNNER_TEMP}/build-started"
      - run: bazel test --config=ci //...
      - name: Keep in the cache only what this build used
        run: |
          du -sh ~/.cache/bazel-disk
          find ~/.cache/bazel-disk -type f ! -newer "${RUNNER_TEMP}/build-started" -delete
          du -sh ~/.cache/bazel-disk
      # How much room the run had left, also when it failed: the next time
      # the disk fills up, the log shows it coming.
      - name: Report disk usage
        if: always()
        run: df -h /

  changelog:
    name: changelog entries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: hack/chloggen.sh validate
